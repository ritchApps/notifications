<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notification System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 32px 16px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 32px;
      color: #111;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      padding: 24px;
      margin-bottom: 32px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #111;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #555;
    }

    select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #333;
      background: #fff;
      transition: border-color 0.2s;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: #555;
    }

    textarea { resize: vertical; min-height: 100px; }

    button {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #333; }
    button:disabled { background: #999; cursor: not-allowed; }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #cc0000;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .success {
      background: #f0fff4;
      border: 1px solid #b2f5c8;
      color: #1a7f3c;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid #e0e0e0;
      font-weight: 600;
      color: #555;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      color: #333;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-delivered { background: #e6f9ee; color: #1a7f3c; }
    .badge-failed    { background: #fff0f0; color: #cc0000; }

    .empty {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 14px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .log-header h2 { margin-bottom: 0; }

    .refresh-btn {
      background: transparent;
      color: #555;
      border: 1px solid #ddd;
      padding: 6px 14px;
      font-size: 13px;
    }

    .refresh-btn:hover { background: #f5f5f5; color: #333; }
  </style>
</head>
<body>
<div class="container">
  <h1>Notification System</h1>

  <!-- FORM -->
  <div class="card">
    <h2>Send Message</h2>
    <div id="formError" class="error"></div>
    <div id="formSuccess" class="success"></div>
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category">
        <option value="">Select a category...</option>
      </select>
    </div>
    <div class="form-group">
      <label for="body">Message</label>
      <textarea id="body" placeholder="Write your message here..."></textarea>
    </div>
    <button id="sendBtn" onclick="sendMessage()">Send Message</button>
  </div>

  <!-- LOG HISTORY -->
  <div class="card">
    <div class="log-header">
      <h2>Log History</h2>
      <button class="refresh-btn" onclick="loadLogs()">Refresh</button>
    </div>
    <div id="logsContainer">
      <div class="empty">Loading logs...</div>
    </div>
  </div>
</div>

<script>
  const API = '';

  async function loadCategories() {
    try {
      const res = await fetch(`${API}/api/messages/categories`);
      const categories = await res.json();
      const select = document.getElementById('category');
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat.value;
        option.textContent = cat.displayName;
        select.appendChild(option);
      });
    } catch (e) {
      console.error('Failed to load categories', e);
    }
  }

  async function loadLogs() {
    const container = document.getElementById('logsContainer');
    try {
      const res = await fetch(`${API}/api/logs`);
      const logs = await res.json();

      if (logs.length === 0) {
        container.innerHTML = '<div class="empty">No notifications sent yet.</div>';
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Category</th>
              <th>Message</th>
              <th>Channel</th>
              <th>Status</th>
              <th>Sent At</th>
            </tr>
          </thead>
          <tbody>
            ${logs.map(log => `
              <tr>
                <td>
                  <div style="font-weight:500">${log.userName}</div>
                  <div style="color:#888;font-size:12px">${log.userEmail}</div>
                </td>
                <td>${log.category}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  ${log.messageBody}
                </td>
                <td>${formatChannel(log.channelType)}</td>
                <td>
                  <span class="badge badge-${log.status.toLowerCase()}">
                    ${log.status}
                  </span>
                </td>
                <td style="color:#888;font-size:12px">${formatDate(log.sentAt)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (e) {
      container.innerHTML = '<div class="empty">Failed to load logs.</div>';
    }
  }

  async function sendMessage() {
    const category = document.getElementById('category').value;
    const body = document.getElementById('body').value.trim();
    const errorDiv = document.getElementById('formError');
    const successDiv = document.getElementById('formSuccess');
    const btn = document.getElementById('sendBtn');

    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    if (!category) {
      showError('Please select a category.');
      return;
    }
    if (!body) {
      showError('Message body cannot be empty.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const res = await fetch(`${API}/api/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category, body })
      });

      if (!res.ok) {
        const err = await res.json();
        showError(err.error || 'Failed to send message.');
        return;
      }

      successDiv.textContent = 'Message sent successfully!';
      successDiv.style.display = 'block';
      document.getElementById('body').value = '';
      document.getElementById('category').value = '';
      await loadLogs();
    } catch (e) {
      showError('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Message';
    }
  }

  function showError(msg) {
    const errorDiv = document.getElementById('formError');
    errorDiv.textContent = msg;
    errorDiv.style.display = 'block';
  }

  function formatChannel(channel) {
    const map = {
      'SMS': 'SMS',
      'EMAIL': 'Email',
      'PUSH_NOTIFICATION': 'Push'
    };
    return map[channel] || channel;
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
  }

  // Init
  loadCategories();
  loadLogs();
</script>
</body>
</html>
