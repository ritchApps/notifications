spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_db
    username: notifications_user
    password: notifications_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
